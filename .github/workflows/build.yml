name: Build SteamDaddy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10.x
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Restore dependencies
        run: dotnet restore SteamDaddyApp/SteamDaddyApp.csproj

      - name: Build SteamDaddy.exe
        shell: pwsh
        run: |
          dotnet publish "SteamDaddyApp/SteamDaddyApp.csproj" -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:UseAppHost=true

      - name: Verify executable
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "SteamDaddyApp/bin/Release/net10.0-windows/win-x64/publish/SteamDaddy.exe"
          if (-not (Test-Path $output)) {
            throw "Build failed: $output was not created"
          }

          $fileInfo = Get-Item $output
          Write-Host "Build successful"
          Write-Host "  File: $($fileInfo.Name)"
          Write-Host "  Size: $([Math]::Round($fileInfo.Length / 1MB, 2)) MB"

          Copy-Item $output (Join-Path $env:GITHUB_WORKSPACE "SteamDaddy.exe") -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SteamDaddy-exe
          path: SteamDaddy.exe
          if-no-files-found: error

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          files: SteamDaddy.exe
          tag_name: v${{ github.run_number }}
          name: SteamDaddy.exe Build ${{ github.run_number }}
          body: |
            Automated build of SteamDaddy.exe

            Build Details:
            - Commit: ${{ github.sha }}
            - Run: ${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
