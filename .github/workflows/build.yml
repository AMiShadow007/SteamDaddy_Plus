name: Build SteamDaddy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate source script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $src = Join-Path $env:GITHUB_WORKSPACE "install_b.ps1"
          if (-not (Test-Path $src)) {
            throw "Missing script: $src"
          }

          $content = Get-Content $src -Raw
          if ([string]::IsNullOrWhiteSpace($content)) {
            throw "Source script is empty: $src"
          }

          Write-Host "Validated script: $src"

      - name: Package installer script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $src = Join-Path $env:GITHUB_WORKSPACE "install_b.ps1"
          $out = Join-Path $env:GITHUB_WORKSPACE "SteamDaddy-installer.ps1"

          Copy-Item $src $out -Force

          if (-not (Test-Path $out)) {
            throw "Package creation failed: $out"
          }

          Get-Item $out | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamDaddy-installer
          path: SteamDaddy-installer.ps1
          if-no-files-found: error
