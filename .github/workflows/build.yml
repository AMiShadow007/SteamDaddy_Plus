name: Build SteamDaddy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PowerShell build dependency
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          Write-Host "Ensuring PSGallery is available and trusted..."
          if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force -Scope CurrentUser
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          Write-Host "Installing ps2exe..."
          Install-Module -Name ps2exe -Scope CurrentUser -Force -AllowClobber -SkipPublisherCheck

          $modulePath = @(
            "$HOME\Documents\WindowsPowerShell\Modules\ps2exe",
            "$HOME\Documents\PowerShell\Modules\ps2exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $modulePath) {
            throw "ps2exe module directory was not created under the expected user module paths."
          }

          $scriptPath = Get-ChildItem -Path $modulePath -Filter "ps2exe.ps1" -Recurse |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $scriptPath) {
            throw "ps2exe.ps1 could not be found under $modulePath"
          }

          Write-Host "Using ps2exe script: $scriptPath"
          "PS2EXE_SCRIPT=$scriptPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build SteamDaddy.exe
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $src = Join-Path $env:GITHUB_WORKSPACE "install_b.ps1"
          $out = Join-Path $env:GITHUB_WORKSPACE "SteamDaddy.exe"

          if (-not (Test-Path $src)) {
            throw "Missing script: $src"
          }

          $ps2exeScript = $env:PS2EXE_SCRIPT
          if (-not $ps2exeScript -or -not (Test-Path $ps2exeScript)) {
            throw "ps2exe script path was not resolved."
          }

          Write-Host "Compiling $src to $out..."
          & $ps2exeScript `
            -inputFile $src `
            -outputFile $out `
            -noConsole

          if (-not (Test-Path $out)) {
            throw "Build failed: $out was not created."
          }

          Get-Item $out | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamDaddy-exe
          path: SteamDaddy.exe
          if-no-files-found: error
