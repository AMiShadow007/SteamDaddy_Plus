name: Build SteamDaddy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PowerShell build dependency
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          Write-Host "Installing ps2exe..."
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber -SkipPublisherCheck

      - name: Build SteamDaddy.exe
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $src = Join-Path $env:GITHUB_WORKSPACE "install_b.ps1"
          $out = Join-Path $env:GITHUB_WORKSPACE "SteamDaddy.exe"

          if (-not (Test-Path $src)) {
            throw "Missing script: $src"
          }

          Write-Host "Compiling $src to $out..."
          & "$HOME\Documents\WindowsPowerShell\Modules\ps2exe\ps2exe.ps1" `
            -inputFile $src `
            -outputFile $out `
            -noConsole

          if (-not (Test-Path $out)) {
            throw "Build failed: $out was not created."
          }

          Get-Item $out | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamDaddy-exe
          path: SteamDaddy.exe
          if-no-files-found: error
